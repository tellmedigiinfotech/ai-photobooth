<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#a63e1e" />
<title>AI Photobooth — Sign in</title>
<style>
    :root {
        --bg:        #faf6ee;
        --surface:   #ffffff;
        --border:    #e6dcca;
        --ink:       #26201b;
        --muted:     #7a6e5f;
        --accent:    #a63e1e;
        --accent-hot:#8c3116;
        --error:     #a6301f;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
    }
    .card {
        max-width: 380px;
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 32px 28px;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.08);
        text-align: center;
    }
    .lock-icon {
        width: 48px;
        height: 48px;
        margin: 0 auto 16px;
        border-radius: 50%;
        background: #f4ecdd;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--accent);
    }
    .lock-icon svg { width: 24px; height: 24px; }
    h1 {
        margin: 0 0 6px;
        font-size: 1.35rem;
        font-weight: 600;
    }
    p.sub {
        margin: 0 0 22px;
        color: var(--muted);
        font-size: 0.95rem;
    }
    .pw-wrap { position: relative; }
    input[type=password], input[type=text] {
        width: 100%;
        padding: 11px 44px 11px 14px;
        font: inherit;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #fff;
    }
    input:focus {
        outline: 2px solid #d9876b;
        outline-offset: 1px;
    }
    .pw-toggle {
        position: absolute;
        right: 4px;
        top: 50%;
        transform: translateY(-50%);
        background: transparent;
        border: 0;
        padding: 6px 8px;
        color: var(--muted);
        cursor: pointer;
        line-height: 0;
    }
    .pw-toggle:hover { color: var(--ink); }
    .pw-toggle svg { width: 20px; height: 20px; display: block; }
    button.primary {
        width: 100%;
        margin-top: 14px;
        background: var(--accent);
        color: #fff;
        border: 0;
        padding: 12px 18px;
        font: inherit;
        font-weight: 600;
        border-radius: 8px;
        cursor: pointer;
    }
    button.primary:hover { background: var(--accent-hot); }
    button.primary:disabled { opacity: 0.6; cursor: progress; }
    .err {
        margin-top: 12px;
        background: #fde6e2;
        border: 1px solid #f0b7ad;
        color: var(--error);
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 0.9rem;
    }
    .foot {
        margin-top: 18px;
        color: var(--muted);
        font-size: 0.82rem;
    }
</style>
</head>
<body>
    <main class="card" role="dialog" aria-labelledby="title">
        <div class="lock-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
        </div>
        <h1 id="title">AI Photobooth</h1>
        <p class="sub">Restricted access — please enter the site password to continue.</p>

        <form id="form" autocomplete="on">
            <div class="pw-wrap">
                <input type="password" id="pw" autocomplete="current-password" placeholder="Site password" autofocus required />
                <button type="button" id="pwToggle" class="pw-toggle" aria-label="Show password" aria-pressed="false" title="Show password">
                    <svg id="pwEye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>
            <button type="submit" class="primary" id="submitBtn">Sign in</button>
            <p id="err" class="err" hidden></p>
        </form>

        <p class="foot">This device will stay signed in indefinitely.</p>
    </main>

<script>
const $ = (id) => document.getElementById(id);

$('pwToggle').addEventListener('click', () => {
    const input = $('pw');
    const btn = $('pwToggle');
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    btn.setAttribute('aria-pressed', String(!showing));
    btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    btn.title = showing ? 'Show password' : 'Hide password';
    $('pwEye').innerHTML = showing
        ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>'
        : '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.79 19.79 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a19.85 19.85 0 0 1-3.17 4.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
    input.focus();
});

$('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = $('pw').value;
    if (!pw) return;
    $('err').hidden = true;
    $('submitBtn').disabled = true;
    $('submitBtn').textContent = 'Signing in…';
    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: pw }),
        });
        if (res.status === 401) throw new Error('Wrong password.');
        if (!res.ok) {
            const j = await res.json().catch(() => ({}));
            throw new Error(j.error || ('Server returned HTTP ' + res.status));
        }
        // Go back to the homepage now that the cookie is set.
        window.location.replace('/');
    } catch (err) {
        $('err').textContent = err.message;
        $('err').hidden = false;
        $('submitBtn').disabled = false;
        $('submitBtn').textContent = 'Sign in';
        $('pw').focus();
        $('pw').select();
    }
});
</script>
</body>
</html>
